<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - AnswerBot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: #0a0a0a;
            color: #ffffff;
        }
        
        .settings-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .settings-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        
        .settings-title {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #b3b3b3;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 6px;
            font-size: 16px;
            background: #2d2d2d;
            color: #ffffff;
            transition: border-color 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #4a9eff;
        }
        
        .btn-change-password {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        
        .btn-change-password:hover {
            background: #357abd;
        }
        
        .btn-change-password:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4a9eff;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
            color: #357abd;
        }
        
        .password-strength {
            margin-top: 5px;
            font-size: 14px;
        }
        
        .strength-weak { color: #ff4757; }
        .strength-medium { color: #ffa502; }
        .strength-strong { color: #2ed573; }
    </style>
</head>
<body>
    <div class="settings-container">
        <a href="{{ url_for('editor') }}" class="back-link">← Вернуться к редактору</a>
        
        <div class="settings-card">
            <h1 class="settings-title">Настройки</h1>
            
            <form id="changePasswordForm">
                <div class="form-group">
                    <label for="currentPassword" class="form-label">Текущий пароль</label>
                    <input type="password" id="currentPassword" name="current_password" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="newPassword" class="form-label">Новый пароль</label>
                    <input type="password" id="newPassword" name="new_password" class="form-input" required minlength="6">
                    <div id="passwordStrength" class="password-strength"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Подтвердите новый пароль</label>
                    <input type="password" id="confirmPassword" name="confirm_password" class="form-input" required>
                </div>
                
                <button type="submit" class="btn-change-password" id="changePasswordBtn">
                    Изменить пароль
                </button>
            </form>
        </div>
    </div>

    <script>
        // Проверка силы пароля
        function checkPasswordStrength(password) {
            let strength = 0;
            let message = '';
            
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            if (strength < 3) {
                message = 'Слабый пароль';
                return { strength: 'weak', message: message };
            } else if (strength < 5) {
                message = 'Средний пароль';
                return { strength: 'medium', message: message };
            } else {
                message = 'Сильный пароль';
                return { strength: 'strong', message: message };
            }
        }
        
        // Обновление индикатора силы пароля
        document.getElementById('newPassword').addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.textContent = '';
                strengthDiv.className = 'password-strength';
                return;
            }
            
            const result = checkPasswordStrength(password);
            strengthDiv.textContent = result.message;
            strengthDiv.className = `password-strength strength-${result.strength}`;
        });
        
        // Обработка формы смены пароля
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('changePasswordBtn');
            
            // Валидация
            if (newPassword !== confirmPassword) {
                alert('Пароли не совпадают');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Новый пароль должен содержать минимум 6 символов');
                return;
            }
            
            // Блокируем кнопку
            submitBtn.disabled = true;
            submitBtn.textContent = 'Изменение...';
            
            try {
                const response = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Пароль успешно изменен!');
                    // Очищаем форму
                    document.getElementById('changePasswordForm').reset();
                    document.getElementById('passwordStrength').textContent = '';
                    document.getElementById('passwordStrength').className = 'password-strength';
                } else {
                    alert('Ошибка: ' + result.message);
                }
            } catch (error) {
                alert('Ошибка при изменении пароля: ' + error.message);
            } finally {
                // Разблокируем кнопку
                submitBtn.disabled = false;
                submitBtn.textContent = 'Изменить пароль';
            }
        });
    </script>
</body>
</html>
